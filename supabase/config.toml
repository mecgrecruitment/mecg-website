project_id = "mecgwebsite"

[api]
schemas = ["public", "graphql_public", "rush"]

[auth]
site_url = "https://mecg-website-mecg-recruitment.vercel.app"
additional_redirect_urls = [
  "https://mecg-website-mecg-recruitment.vercel.app/**",
  "https://mecg-website-three.vercel.app/**",
  "https://mecg-website-git-main-mecg-recruitment.vercel.app/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[db]
major_version = 17

[db.migrations]
enabled = true

[storage.vector]
enabled = false
