<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font-sans,Arial,sans-serif);color:var(--foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}button{font:inherit;border:1px solid var(--border);border-radius:8px;padding:9px 13px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#254f9f;color:#fff;border-color:#254f9f}button:focus-visible,a:focus-visible{outline:2px solid var(--foreground);outline-offset:3px}figure{margin:0}img{width:100%;height:auto;display:block;border:1px solid var(--border);border-radius:10px}.phone{max-width:300px;margin:auto}figcaption{font-size:13px;color:var(--muted-foreground);margin-top:12px}a{color:inherit;text-underline-offset:4px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:16px}.live{display:inline-flex;min-height:44px;align-items:center;border-radius:8px;background:#254f9f;color:#fff;padding:10px 16px;text-decoration:none;font-weight:600}.note{font-size:12px;color:var(--muted-foreground);margin:12px 0 0}[hidden]{display:none}</style></head><body><nav aria-label="Homepage revision views"><button aria-pressed="true" aria-controls="opening" data-target="opening">Opening</button><button aria-pressed="false" aria-controls="questions" data-target="questions">Project explorer</button><button aria-pressed="false" aria-controls="mobile" data-target="mobile">Mobile</button><button aria-pressed="false" aria-controls="before" data-target="before">Before</button></nav><figure id="opening"><img src="/home/rahil/.t3/userdata/browser-artifacts/browser-screenshot-localhost-mvcjlzer-2b055cfd.png" alt="Revised MECG homepage with a light header and hero, smaller deep-blue headline and manually selectable real photographs"><figcaption>A lighter composition, smaller type and natural photography. Orange stays with the primary action.</figcaption></figure><figure id="questions" hidden><img src="/home/rahil/.t3/userdata/browser-artifacts/browser-screenshot-localhost-mvcjm06w-8e091853.png" alt="MECG project question explorer with Data Analytics selected and an example question about interpreting data"><figcaption>Choose an area, explore a possible question, then carry that area into the contact form’s editable subject.</figcaption></figure><figure id="mobile" hidden><img class="phone" src="/home/rahil/.t3/userdata/browser-artifacts/browser-screenshot-localhost-mvcjlztm-d9de1112.png" alt="The revised homepage at mobile width with readable text, aligned calls to action and real chapter photography"><figcaption>Mobile keeps the description, both audience routes and people within a tighter layout.</figcaption></figure><figure id="before" hidden><img src="/home/rahil/.t3/userdata/browser-artifacts/browser-screenshot-localhost-mvcjbnbk-09aef228.png" alt="Previous MECG homepage dominated by a large blue hero"><figcaption>Previous opening: a large blue field with less contrast between the page’s sections and fewer things to explore.</figcaption></figure><div class="actions"><a class="live" target="_blank" rel="noopener" href="http://localhost:3010/home">Open interactive homepage ↗</a><span>Also try the engagement steps and chapter photographs.</span></div><p class="note">These are actual browser captures. The linked local preview uses sample data and blocks submissions. No deployment was made.</p><script>document.querySelectorAll('button[data-target]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-target]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('figure').forEach(f=>f.hidden=f.id!==b.dataset.target)});console.log('Horizontal overflow:',document.documentElement.scrollWidth>innerWidth);</script></body></html>
