name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations are only otherwise validated by applying them to a real
      # database. libpg_query is the parser Postgres itself uses, so this
      # catches syntax errors, including inside plpgsql function bodies,
      # without needing one.
      - run: pip3 install --quiet pglast
      - run: npm run check:sql
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # /join is prerendered, so the build reads these. They are the
          # browser-visible pair, not secrets. The placeholders let CI build
          # without repository secrets: the recruitment RPC fails, the page
          # renders its "no active cycle" state, and the artifact is discarded.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci.invalid' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder' }}
