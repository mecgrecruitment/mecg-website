name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared build/env contract — fail loudly if a required key is dropped from the workflow.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  CHECK_ENV_MODE: process

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Env contract
        run: npm run check:env

      - name: Sensitive audit
        run: npm run audit:sensitive

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    # Opt-in: set repo secret E2E_BASE_URL to a deployed origin with working Auth.
    # Without it, this job is skipped so PRs stay green on lint/typecheck/build alone.
    if: ${{ secrets.E2E_BASE_URL != '' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E against deployment
        run: npm run test:e2e:live
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          # Signup hits live Auth — only enable when the target allows disposable @umich.edu.
          E2E_ALLOW_SIGNUP: ${{ secrets.E2E_ALLOW_SIGNUP }}
