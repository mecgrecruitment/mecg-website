name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # /join is prerendered, so the build reads these. They are the
          # browser-visible pair, not secrets. The placeholders let CI build
          # without repository secrets: the recruitment RPC fails, the page
          # renders its "no active cycle" state, and the artifact is discarded.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci.invalid' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder' }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - id: supabase-link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # db lint, the SQL tests, and migration parity below all need a
          # linked live project, which needs these two secrets. A fork PR has
          # neither, so this links if it can and otherwise skips the database
          # checks with a clear message instead of failing the build.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_ACCESS_TOKEN and/or SUPABASE_DB_PASSWORD not set, skipping db lint, SQL tests, and migration parity check"
            echo "linked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          supabase link --project-ref chrxtsohxazngabdcpzb
          echo "linked=true" >> "$GITHUB_OUTPUT"
      - if: steps.supabase-link.outputs.linked == 'true'
        run: npm run supabase:lint
      - if: steps.supabase-link.outputs.linked == 'true'
        run: npm run test:supabase
      - if: steps.supabase-link.outputs.linked == 'true'
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const { migrations = [] } = JSON.parse(execFileSync("supabase", ["migration", "list", "--linked", "--output-format", "json"], { encoding: "utf8" }));
            const drift = migrations.some((migration) => migration.local !== migration.remote);
            if (drift) { console.error("Local and remote migration ledgers differ"); process.exit(1); }
            console.log("Migration ledger parity OK");
          '
