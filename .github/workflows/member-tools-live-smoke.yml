name: Member tools live smoke
on:
  push:
    branches: [verify/member-tools-live-smoke-20261112]
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Verify production health and anonymous denial
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_THIRD_PARTY_CLERK_DOMAIN: ci-placeholder.clerk.accounts.dev
        run: node scripts/member-tools/smoke-live.mjs
